<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — MindEase | Mental Health & Mood Analyzer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet"/>
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet"/>
</head>
<body class="auth-page d-flex align-items-center justify-content-center min-vh-100">

<div class="auth-card p-5 rounded-4" style="width:100%; max-width:420px;">
  <div class="text-center mb-4">
    <a href="/" class="text-decoration-none">
      <h3 class="fw-bold text-white">
        <i class="bi bi-heart-pulse-fill text-primary me-2"></i>MindEase
      </h3>
    </a>
    <p class="text-secondary small mb-2">Mental Health & Mood Analyzer</p>
    <p class="text-secondary">Welcome back. We're glad you're here.</p>
  </div>

  {% if error %}
  <div class="alert alert-danger border-0 py-2">
    <i class="bi bi-exclamation-circle me-2"></i>{{ error }}
  </div>
  {% endif %}

  <form method="POST" action="{{ url_for('login') }}">
    <div class="mb-3">
      <label class="form-label text-secondary small">Email</label>
      <input type="email" name="email" class="form-control bg-dark border-secondary text-white"
        placeholder="you@email.com" required autocomplete="email"/>
    </div>
    <div class="mb-4">
      <label class="form-label text-secondary small">Password</label>
      <input type="password" name="password" class="form-control bg-dark border-secondary text-white"
        placeholder="••••••••" required autocomplete="current-password"/>
    </div>
    <button type="submit" class="btn btn-primary w-100 btn-lg">
      <i class="bi bi-box-arrow-in-right me-2"></i>Login
    </button>
  </form>

  <p class="text-center text-secondary mt-4 mb-0">
    Don't have an account?
    <a href="{{ url_for('register') }}" class="text-primary text-decoration-none">Sign up free</a>
  </p>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
