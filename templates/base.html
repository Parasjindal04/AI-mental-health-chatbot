<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}MindEase{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet" />
</head>

<body>

  {% if current_user.is_authenticated %}
  <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('dashboard') }}">
        <i class="bi bi-heart-pulse-fill text-primary me-2"></i>MindEase
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav ms-auto gap-1">
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'records' %}active{% endif %}" href="{{ url_for('records') }}">
              <i class="bi bi-folder2 me-1"></i>Records
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'feedback' %}active{% endif %}"
              href="{{ url_for('feedback') }}">
              <i class="bi bi-chat-square-heart me-1"></i>Feedback
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
              href="{{ url_for('dashboard') }}">
              <i class="bi bi-grid me-1"></i>Dashboard
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'chat' %}active{% endif %}" href="{{ url_for('chat') }}">
              <i class="bi bi-chat-heart me-1"></i>AI Chat
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'journal' %}active{% endif %}" href="{{ url_for('journal') }}">
              <i class="bi bi-journal-text me-1"></i>Journal
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'assessment' %}active{% endif %}"
              href="{{ url_for('assessment') }}">
              <i class="bi bi-clipboard2-pulse me-1"></i>Assessment
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'history' %}active{% endif %}" href="{{ url_for('history') }}">
              <i class="bi bi-graph-up me-1"></i>History
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'breathing' %}active{% endif %}"
              href="{{ url_for('breathing') }}">
              <i class="bi bi-wind me-1"></i>Breathing
            </a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.endpoint == 'report' %}active{% endif %}" href="{{ url_for('report') }}">
              <i class="bi bi-file-earmark-bar-graph me-1"></i>Report
            </a>
          </li>
          <li class="nav-item ms-2">
            <a class="btn btn-outline-danger btn-sm" href="{{ url_for('logout') }}">
              <i class="bi bi-box-arrow-right me-1"></i>Logout
            </a>
          </li>
        </ul>
      </div>
    </div>
  </nav>
  {% endif %}

  <main class="{% if current_user.is_authenticated %}pt-nav{% endif %}">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  {% block scripts %}{% endblock %}
</body>

</html>
